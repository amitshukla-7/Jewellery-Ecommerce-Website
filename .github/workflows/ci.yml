name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        
    - name: Install Client Dependencies
      working-directory: ./client
      run: npm install

    - name: Lint Client
      working-directory: ./client
      run: npm run lint

    - name: Install Server Dependencies
      working-directory: ./server
      run: npm install

    - name: Test Server
      working-directory: ./server
      run: npm test
